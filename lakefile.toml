name = "hex-perm-group-theory"
defaultTargets = ["HexPermGroupTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPermGroup"
git = "https://github.com/leanprover/hex-perm-group.git"
rev = "v0.10.0"
options = { hexPermGroupNative = "false" }

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexPermGroupTheory"

[[lean_lib]]
name = "HexPermGroupTheoryTests"
globs = ["HexPermGroupTheory.Tests", "HexPermGroupTheory.CertificateTests", "HexPermGroupTheory.TacticTests"]
